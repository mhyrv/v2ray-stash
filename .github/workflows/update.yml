name: update-subscription

on:
  schedule:
    - cron: "23 */1 * * *"     # every 61 hour (UTC)
  workflow_dispatch:            # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write               # lets the job commit output/ back to the repo

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Xray-core
        run: |
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          sudo unzip -qo /tmp/xray.zip xray -d /usr/local/bin
          xray version | head -n1

      - name: Scan, test, write output/
        env:                    # only needed for `mode: api` sources (groups); empty is fine otherwise
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python src/main.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git diff --cached --quiet || { git commit -m "update $(date -u +'%Y-%m-%d %H:%M') UTC" && git push; }
